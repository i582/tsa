name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag (for example, v1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        default: false
        type: boolean

run-name: Release ${{ inputs.tag }} from ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: 'Build and publish release'
    runs-on: ubuntu-22.04
    container: explyt/tsa-env:v1.1.3

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 'Add git path to trusted'
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: 'Validate release tag'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git check-ref-format "refs/tags/${RELEASE_TAG}"

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "Could not check whether tag ${RELEASE_TAG} exists" >&2
            exit "$status"
          fi

      - name: 'Assemble'
        run: ./gradlew clean :tsa-cli:shadowJar

      - name: 'Verify JAR and create checksum'
        run: |
          java -jar tsa-cli/build/libs/tsa-cli.jar --help
          cd tsa-cli/build/libs
          sha256sum tsa-cli.jar > tsa-cli.jar.sha256

      - name: 'Publish release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          name: ${{ inputs.tag }}
          body: |
            Built from branch `${{ github.ref_name }}` at commit `${{ github.sha }}`.
          fail_on_unmatched_files: true
          files: |
            tsa-cli/build/libs/tsa-cli.jar
            tsa-cli/build/libs/tsa-cli.jar.sha256
